name: Checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --python 3.12
      - run: uv run pytest -q
        env:
          SEMANTIC_SEARCH: "false"
          LIVE_PLACE_SEARCH: "false"
          LLM_PROVIDER: "mock"
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chrome
        working-directory: frontend
      - run: |
          uv run uvicorn backend.main:app --host 127.0.0.1 --port 8000 --no-access-log &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then ready=true; break; fi
            kill -0 "$server_pid" || exit 1
            sleep 1
          done
          if [ "$ready" != true ]; then echo "API failed to start"; exit 1; fi
          cd frontend
          npm run test:e2e
        env:
          SEMANTIC_SEARCH: "false"
          LIVE_PLACE_SEARCH: "false"
          LLM_PROVIDER: "mock"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-diagnostics
          path: frontend/test-results/
          retention-days: 7
